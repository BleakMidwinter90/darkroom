name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The unit tests cover the arithmetic. This drives a real browser and
      # checks that a real file comes out converted, resized and stripped —
      # which is the only thing that actually matters for an image tool.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: npm run smoke
